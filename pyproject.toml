[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cbnsl-benchmark"
version = "0.1.0"
description = "Benchmark for Continuous Bayesian Network Structure Learning"
requires-python = ">=3.10"

# Only pure-Python dependencies are declared here, so `pip install -e .` is safe.
# The C++-backed stack (pyAgrum, OpenTURNS, otagrum) comes from conda / source —
# see README. Extra algorithms live in the optional groups below.
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "seaborn",
    "tqdm",
]

[project.optional-dependencies]
# Extra structure-learning methods. notears is git-only; torch comes from conda.
algos = ["lingam", "dagma"]
dev = ["pytest", "black"]

[tool.setuptools.packages.find]
include = ["pipeline*", "algorithms*", "metrics*", "data*", "experiments*"]
exclude = ["experiments.tests*", "__pycache__*"]
